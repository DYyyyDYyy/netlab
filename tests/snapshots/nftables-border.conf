#!/usr/sbin/nft -f
# generated by netlab from IPAM for border - do not edit
flush ruleset

define WAN_IF = "wan0"
define WAN_IP = 203.0.113.1
define INSIDE = { 10.0.12.0/29, 10.0.13.0/29, 10.0.23.0/29, 10.10.1.0/24, 10.10.2.0/24, 10.255.0.0/24 }

table inet filter {
    chain input {
        type filter hook input priority filter; policy drop;
        iif "lo" accept
        ct state established,related accept
        ct state invalid drop
        ip protocol 89 accept comment "ospf"
        ip protocol icmp accept
        iifname != $WAN_IF ip saddr $INSIDE accept
        counter comment "input default deny"
    }

    chain forward {
        type filter hook forward priority filter; policy drop;
        ct state established,related accept
        ct state invalid drop
        # inside <-> inside transit through the border
        iifname != $WAN_IF oifname != $WAN_IF accept
        # inside -> internet
        iifname != $WAN_IF oifname $WAN_IF ip saddr $INSIDE ip protocol icmp accept
        iifname != $WAN_IF oifname $WAN_IF ip saddr $INSIDE tcp dport { 80, 443 } accept
        iifname != $WAN_IF oifname $WAN_IF ip saddr $INSIDE udp dport { 53, 123 } accept
        # internet -> inside: only published services (DNAT)
        iifname $WAN_IF ct status dnat accept
        counter comment "forward default deny"
    }
}

table ip nat {
    chain prerouting {
        type nat hook prerouting priority dstnat; policy accept;
        iifname $WAN_IF ip daddr $WAN_IP tcp dport 8080 dnat to 10.10.2.2:80 comment "publish srv1"
    }

    chain postrouting {
        type nat hook postrouting priority srcnat; policy accept;
        # PAT: many inside hosts share the single WAN address
        oifname $WAN_IF ip saddr $INSIDE masquerade
    }
}
